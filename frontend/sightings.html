<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Guardian | Sightings</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
     <div class="sidebar-header">
    <img src="pictures/pngtree-world-wildlife-day-with-the-animal-label-png-image_5893073.jpg" alt="Wildlife Logo" class="logo-img" onclick="location.reload();" style="cursor: pointer;">
    <h2>WildGuard</h2>
    <p class="logo-sub">Conservation Hub</p>
</div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="animals.html" class="nav-item">
                    <i class="fas fa-paw"></i>
                    <span>Animals</span>
                </a>
                <a href="sightings.html" class="nav-item active">
                    <i class="fas fa-eye"></i>
                    <span>Sightings</span>
                </a>
                <a href="locations.html" class="nav-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Locations</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-card">
                    <div class="user-avatar" id="userAvatar">👤</div>
                    <div class="user-info-side">
                        <div class="user-name" id="sidebarUserName">Loading...</div>
                        <div class="user-role" id="sidebarUserRole">Role</div>
                    </div>
                    <button onclick="logout()" class="logout-icon-btn">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="top-header">
                <div class="header-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search sightings...">
                </div>
                <div class="header-actions">
                    <div class="date-display" id="currentDate"></div>
                </div>
            </header>
            
            <div class="content-area">
                <div class="page-header">
                    <div>
                        <h1><i class="fas fa-eye"></i> Wildlife Sightings</h1>
                        <p>Record and monitor animal sightings in the wild</p>
                    </div>
                <button id="addSightingBtn" class="btn-primary" style="display: none;">
    <i class="fas fa-plus"></i> Record New Sighting
</button>
                </div>
                
                <div class="stats-row">
                    <div class="info-box">
                        <i class="fas fa-paw"></i>
                        <strong>Total Animals:</strong> <span id="totalAnimalsCount">0</span>
                    </div>
                    <div class="info-box">
                        <i class="fas fa-eye"></i>
                        <strong>Total Sightings:</strong> <span id="totalSightingsCount">0</span>
                    </div>
                </div>
                
                <div id="sightingsContainer">
                    <div class="loading-spinner">Loading sightings...</div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="sightingModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Record New Sighting</h2>
                <button class="modal-close" onclick="closeSightingModal()">&times;</button>
            </div>
            <form id="sightingForm">
                <div class="form-group">
                    <label>Select Animal</label>
                    <select id="animalSelect" required>
                        <option value="">-- Choose an animal --</option>
                    </select>
                    <small style="color: #666; font-size: 11px;">Only animals you've added appear here</small>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="sightingLocation" placeholder="e.g., Amboseli National Park" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="sightingDate" required>
                </div>
                <div class="form-group">
                    <label>Number of Animals</label>
                    <input type="number" id="sightingCount" placeholder="e.g., 5" required>
                </div>
                <div class="form-group">
                    <label>Notes (Optional)</label>
                    <textarea id="sightingNotes" rows="3" placeholder="Additional observations..."></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-save">Save Sighting</button>
                    <button type="button" class="btn-cancel" onclick="closeSightingModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    

    <div id="detailModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="detailTitle">Sighting Details</h2>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <script src="mockData.js"></script>
    <script src="sightings.js"></script>
</body>
</html>
