<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Guardian | Animals</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
   <div class="sidebar-header">
    <img src="pictures/pngtree-world-wildlife-day-with-the-animal-label-png-image_5893073.jpg" alt="Wildlife Logo" class="logo-img" onclick="location.reload();" style="cursor: pointer;">
    <h2>WildGuard</h2>
    <p class="logo-sub">Conservation Hub</p>
</div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="animals.html" class="nav-item active">
                    <i class="fas fa-paw"></i>
                    <span>Animals</span>
                </a>
                <a href="sightings.html" class="nav-item">
                    <i class="fas fa-eye"></i>
                    <span>Sightings</span>
                </a>
                <a href="locations.html" class="nav-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Locations</span>
                </a>
            </nav>
            
            <div class="sidebar-footer">
                <div class="user-card">
                    <div class="user-avatar" id="userAvatar">👤</div>
                    <div class="user-info-side">
                        <div class="user-name" id="sidebarUserName">Loading...</div>
                        <div class="user-role" id="sidebarUserRole">Role</div>
                    </div>
                    <button onclick="logout()" class="logout-icon-btn">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </aside>
        
        <main class="main-content">
            <header class="top-header">
                <div class="header-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search animals...">
                </div>
                <div class="header-actions">
                    <div class="date-display" id="currentDate"></div>
                </div>
            </header>
            
            <div class="content-area">
                <div class="page-header">
                    <div>
                        <h1><i class="fas fa-paw"></i> Wildlife Species</h1>
                        <p>Manage and monitor all protected animal species</p>
                    </div>
                  <button id="addAnimalBtn" class="btn-primary" style="display: none;">
    <i class="fas fa-plus"></i> Add New Species
</button>
                </div>
                
                <div class="filter-bar">
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="Critical">Critical</button>
                        <button class="filter-btn" data-filter="High">High Threat</button>
                        <button class="filter-btn" data-filter="Endangered">Endangered</button>
                    </div>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="grid">
                            <i class="fas fa-th-large"></i>
                        </button>
                        <button class="view-btn" data-view="list">
                            <i class="fas fa-list"></i>
                        </button>
                    </div>
                </div>
                
                <div id="animalsContainer" class="animals-grid-view">
                    <div class="loading-spinner">Loading animals...</div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="animalModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add New Species</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="animalForm">
                <input type="hidden" id="animalId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Common Name</label>
                        <select id="animalName" required>
                            <option value="">-- Select an animal --</option>
                            <option value="African Elephant">🐘 African Elephant</option>
                            <option value="Bengal Tiger">🐯 Bengal Tiger</option>
                            <option value="Mountain Gorilla">🦍 Mountain Gorilla</option>
                            <option value="Giant Panda">🐼 Giant Panda</option>
                            <option value="Sea Turtle">🐢 Sea Turtle</option>
                            <option value="Black Rhino">🦏 Black Rhino</option>
                            <option value="Orangutan">🦧 Orangutan</option>
                            <option value="Snow Leopard">🐆 Snow Leopard</option>
                            <option value="Lion">🦁 Lion</option>
                            <option value="Giraffe">🦒 Giraffe</option>
                            <option value="Zebra">🦓 Zebra</option>
                            <option value="Cheetah">🐆 Cheetah</option>
                            <option value="Hippopotamus">🦛 Hippopotamus</option>
                            <option value="Rhinoceros">🦏 Rhinoceros</option>
                            <option value="Polar Bear">🐻‍❄️ Polar Bear</option>
                            <option value="Koala">🐨 Koala</option>
                            <option value="Kangaroo">🦘 Kangaroo</option>
                            <option value="Penguin">🐧 Penguin</option>
                            <option value="Flamingo">🦩 Flamingo</option>
                            <option value="Peacock">🦚 Peacock</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Scientific Name</label>
                        <input type="text" id="scientificName" required placeholder="Enter scientific name">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Population</label>
                        <input type="number" id="population" required placeholder="Estimated population">
                    </div>
                    <div class="form-group">
                        <label>Habitat</label>
                        <input type="text" id="habitat" required placeholder="Natural habitat">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Threat Level</label>
                        <select id="threatLevel">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Critical">Critical</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Conservation Status</label>
                        <select id="conservationStatus">
                            <option value="Least Concern">Least Concern</option>
                            <option value="Vulnerable">Vulnerable</option>
                            <option value="Endangered">Endangered</option>
                            <option value="Critically Endangered">Critically Endangered</option>
                        </select>
                    </div>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-save">Save Species</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="detailModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="detailTitle">Animal Details</h2>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div id="detailContent"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="supabase.js"></script>>
    <script src="animals.js"></script>
</body>
</html>
